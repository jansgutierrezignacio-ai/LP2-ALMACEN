# Nombre de nuestra aplicacion
spring.application.name=lp2-almacen

# Puerto del servidor web Spring Boot
server.port=8056

# Conexion con MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/bd_almacen?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Configuracion de JPA e Hibernate 
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.thymeleaf.cache=false

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.globally_quoted_identifiers=false