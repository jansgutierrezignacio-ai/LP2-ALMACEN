<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" 
      lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/style/inicio.css}">
</head>
<body>
    <div class="d-flex">

        <!-- Contenido principal -->
        <div class="content flex-grow-1 p-4">

            <!-- Topbar -->
            <div class="topbar d-flex justify-content-between align-items-center mb-4">
                <h5 class="m-0"><i class="bi bi-speedometer2 me-2"></i>Autopartes SAC</h5>
                <div class="badge-role d-flex align-items-center gap-2">
                    <i class="bi bi-person-circle fs-5"></i>
					<span th:text="${usuario}" class="fw-bold">Usuario</span> 
					<span class="opacity-50">|</span>
					<span th:text="${rolUsuarioActual}">Rol</span>
                </div>
            </div>
            
           
            <div class="container-fluid p-0">
                <div class="row g-4">
                    
                    <!-- Clientes -->
                    <div class="col-12 col-sm-6 col-lg-3">
                        <a th:href="@{/clientes}" class="text-decoration-none">
                            <div class="card card-blue card-action p-3 text-white">
                                <div class="d-flex justify-content-between align-items-center">
                                    <h6>Clientes</h6>
                                    <i class="bi bi-people fs-1"></i>
                                </div>
                                <h3 th:text="${totalClientes != null ? totalClientes : 0}">0</h3>
                            </div>
                        </a>
                    </div>

                    <!-- Proveedores -->
                    <div class="col-12 col-sm-6 col-lg-3">
                        <a th:href="@{/proveedores}" class="text-decoration-none">
                            <div class="card card-orange card-action p-3 text-white">
                                <div class="d-flex justify-content-between align-items-center">
                                    <h6>Proveedores</h6>
                                    <i class="bi bi-truck fs-1"></i>
                                </div>
                                <h3 th:text="${totalProveedores != null ? totalProveedores : 0}">0</h3>
                            </div>
                        </a>
                    </div>

                    <!-- Productos -->
                    <div class="col-12 col-sm-6 col-lg-3">
                        <a th:href="@{/productos/listar}" class="text-decoration-none">
                            <div class="card card-darkblue card-action p-3 text-white">
                                <div class="d-flex justify-content-between align-items-center">
                                    <h6>Productos</h6>
                                    <i class="bi bi-box-seam fs-1"></i>
                                </div>
                                <h3 th:text="${totalStock != null ? totalStock : 0}">0</h3>
                            </div>
                        </a>
                    </div>

                    <!-- Reportes -->
                    <div class="col-12 col-sm-6 col-lg-3">
                        <a th:href="@{/reportes}" class="text-decoration-none">
                            <div class="card card-brown card-action p-3 text-white">
                                <div class="d-flex justify-content-between align-items-center">
                                    <h6>Reporte</h6>
                                    <i class="bi bi-graph-up-arrow fs-1"></i>
                                </div>
                                <h3 th:text="${totalReporte != null ? totalReporte : 0}">0</h3>
                            </div>
                        </a>
                    </div>

                    <!-- Movimientos -->
                    <div class="col-12 col-sm-6 col-lg-3">
                        <a th:href="@{/movimientos/listar}" class="text-decoration-none">
                            <div class="card card-emerald card-action p-3 text-white">
                                <div class="d-flex justify-content-between align-items-center">
                                    <h6>Movimientos</h6>
                                    <i class="bi bi-clock-history fs-1"></i>
                                </div>
                                <h3 th:text="${totalMovimientos != null ? totalMovimientos : 0}">0</h3>
                            </div>
                        </a>
                    </div>

                    <!-- Ventas -->
                    <div class="col-12 col-sm-6 col-lg-3">
                        <a th:href="@{/ventas/listar}" class="text-decoration-none">
                            <div class="card card-teal card-action p-3 text-white">
                                <div class="d-flex justify-content-between align-items-center">
                                    <h6>Ventas</h6>
                                    <i class="bi bi-cart-check fs-1"></i>
                                </div>
                                <h3 th:text="${totalVentas != null ? totalVentas : 0}">0</h3>
                            </div>
                        </a>
                    </div>

                    <!-- Salir -->
                    <div class="col-12 col-sm-6 col-lg-3">
                        <a th:href="@{/login}" class="text-decoration-none">
                            <div class="card card-red card-action p-3 text-white">
                                <div class="d-flex justify-content-between align-items-center">
                                    <h6>Salir</h6>
                                    <i class="bi bi-box-arrow-right fs-1"></i>
                                </div>
                                <small class="mt-auto opacity-75">Cerrar Sesión</small>
                            </div>
                        </a>
                    </div>

                </div> 
            </div> 

        </div> 
    </div> 

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
