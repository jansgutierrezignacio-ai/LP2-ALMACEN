<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
	<meta charset="UTF-8">
	<title>Inicio - Sistema de Almacén</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

	<!-- Estilos -->
    <link rel="stylesheet" th:href="@{/style/inicio.css}">

</head>
<body>
	<div class="d-flex">

    <!-- Sidebar -->
   

    <!-- Contenido -->
    <div class="content flex-grow-1 p-3">

        <!-- Topbar -->
        <div class="topbar d-flex justify-content-between align-items-center px-4">
            <h5>Dashboard</h5>
            <span class="text-white">
            	<i class="bi bi-person-circle"></i>
            	<span th:text="${session.usuario != null ? session.usuario.username : 'Usuario'}">Usuario</span> 
            	(<span th:text="${session.usuario != null && session.usuario.nombreTipo != null ? session.usuario.nombreTipo : 'Administrador'}">Tipo</span>)
            </span>
        </div>

        <div class="container-fluid mt-4">

            <!-- Cards -->
            <div class="row g-3">
                <div class="col-md-3">
                	<a th:href="@{/clientes}" style="text-decoration: none;">
                    	<div class="card card-blue card-action p-3 text-white">
                        	<i class="bi bi-people fs-2"></i>
                        	<h6>Clientes</h6>
                        	<h3 th:text="${totalClientes != null ? totalClientes : 0}">0</h3>
                    	</div>
                    </a>
                </div>

                <div class="col-md-3">
                	<a th:href="@{/proveedores}" style="text-decoration: none;">
                    	<div class="card card-orange card-action p-3 text-white">
                        	<i class="bi bi-truck fs-2"></i>
                        	<h6>Proveedores</h6>
                        	<h3 th:text="${totalProveedores != null ? totalProveedores : 0}">0</h3>
                    	</div>
                    </a>
                </div>

				<div class="col-md-3">
					
					<a th:href="@{/productos/listar}" style="text-decoration: none;">
					    <div class="card card-darkblue card-action p-3 text-white">
					        <i class="bi bi-box-seam fs-2"></i>
					        <h6>Productos</h6>
					        <h3 th:text="${totalStock != null ? totalStock : 0}">0</h3>
					    </div>
					</a>
				</div>
                
                <div class="col-md-3">
    				<a th:href="@{/reportes}" style="text-decoration: none;">
        				<div class="card card-brown card-action p-3 text-white">
            				<i class="bi bi-graph-up-arrow fs-2"></i>
            				<h6>Reporte</h6>
            				<h3 th:text="${totalReporte != null ? totalReporte : 0}">0</h3>
        				</div>
    				</a>
				</div>

                <div class="col-md-3">
    				<a th:href="@{/movimientos/listar}" style="text-decoration: none;">
        				<div class="card card-gray card-action p-3 text-white">
            				<i class="bi bi-clock-history fs-2"></i>
            				<h6>Movimientos</h6>
            				<h3 th:text="${totalMovimientos != null ? totalMovimientos : 0}">0</h3>
        				</div>
    				</a>
				</div>
				
                
                    </a>
                </div>
                
			</div>

		</div>
	</div>
	</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
