<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso Denegado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="card text-center shadow p-4" style="max-width: 400px;">
        <div class="card-body">
            <h1 class="text-danger display-4">⚠️</h1>
            <h3 class="card-title text-danger">Acceso Denegado</h3>
            <p class="card-text text-muted mt-3">
                No tienes los permisos necesarios (Rol Administrador) para realizar esta acción de eliminación o acceder a esta sección.
            </p>
            <a th:href="@{/inicio}" class="btn btn-primary mt-2">Volver al Inicio</a>
        </div>
    </div>
</body>
</html>
