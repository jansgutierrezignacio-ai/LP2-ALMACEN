# Importa el archivo .env local (no versionado) como propiedades de Spring.
# Si el archivo no existe, la aplicacion arranca igual y usa los valores por defecto.
spring.config.import=optional:file:.env[.properties]

# Conexion automatica a MySQL (credenciales tomadas del entorno o del archivo .env)
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:BD_ALMACEN}?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_ROOT_USER:root}
spring.datasource.password=${MYSQL_ROOT_PASSWORD:}

# Configuracion interna de JPA y Hibernate
spring.jpa.show-sql=true
# Usar los nombres tal cual estan declarados en @Table/@Column (el esquema real
# usa mayusculas/underscore: Usuarios, idUsuario, id_proveedor, ...). Si no se
# fija esta estrategia, Spring Boot convierte a snake_case en minuscula y no coincide.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
# El esquema ya existe (script BD_ALMACEN.sql): Hibernate no lo modifica.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Spring MVC: resolucion de las vistas JSP (los .jsp viven en la raiz de src/main/webapp)
spring.mvc.view.prefix=/
spring.mvc.view.suffix=.jsp

# Codificación UTF-8 para requests/responses (evita doble encoding y tildes rotas)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.servlet.encoding.force-request=true
server.servlet.encoding.force-response=true
server.tomcat.uri-encoding=UTF-8
server.tomcat.accesslog.encoding=UTF-8

# Seguridad de la sesión: la cookie no es accesible desde JavaScript (http-only),
# no se envía en peticiones de otro sitio (same-site, mitiga CSRF) y caduca tras
# un tiempo máximo de inactividad.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
