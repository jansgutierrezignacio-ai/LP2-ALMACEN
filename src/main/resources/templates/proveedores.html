<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/comunes :: head('Proveedores')}"></head>
<body>
<div class="d-flex">

    <nav th:replace="~{fragments/comunes :: menu}"></nav>

    <div class="content flex-grow-1 p-3">
        <div th:replace="~{fragments/comunes :: topbar('Proveedores', 'bi-truck')}"></div>

        <div class="alert alert-success alert-dismissible fade show mt-3" role="alert"
             th:if="${!#strings.isEmpty(mensajeOk)}">
            <i class="bi bi-check-circle"></i> <span th:text="${mensajeOk}">OK</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="nav nav-pills nav-pills-custom d-flex flex-nowrap overflow-auto gap-3 p-2" role="tablist">
            <div class="nav-link text-center p-3" th:classappend="${activeTab != 'agregar'} ? 'active'"
                 data-bs-toggle="pill" data-bs-target="#listar">
                <i class="bi bi-card-list fs-3"></i><div>Listar Proveedor</div>
            </div>
            <div class="nav-link text-center p-3" th:classappend="${activeTab == 'agregar'} ? 'active'"
                 data-bs-toggle="pill" data-bs-target="#agregar">
                <i class="bi bi-plus-circle fs-3"></i><div>Agregar Proveedor</div>
            </div>
            <div class="nav-link text-center p-3" data-bs-toggle="pill" data-bs-target="#consultar">
                <i class="bi bi-search fs-3"></i><div>Consultar Proveedor</div>
            </div>
        </div>

        <div class="tab-content">

            <!-- LISTAR -->
            <div class="tab-pane fade" id="listar" th:classappend="${activeTab != 'agregar'} ? 'show active'">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5>Listado de Proveedores (<span th:text="${cantReg != null ? cantReg : 0}">0</span>)</h5>
                    <form th:action="@{/proveedores}" method="get" class="d-flex gap-2">
                        <input type="hidden" name="type" value="buscar"/>
                        <input type="text" name="txtBuscar" th:value="${txtBuscar}" class="form-control"
                               placeholder="Buscar por razón social...">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-search"></i></button>
                        <a th:href="@{/proveedores(type=listar)}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-clockwise"></i>
                        </a>
                    </form>
                </div>
                <table class="table table-custom table-hover">
                    <thead>
                        <tr><th>ID</th><th>RUC</th><th>Razón Social</th><th>Teléfono</th><th>Estado</th><th>Acciones</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${dataProveedor}">
                            <td th:text="${p.id_proveedor}">1</td>
                            <td th:text="${p.ruc}">00000000000</td>
                            <td th:text="${p.razon_social}">Razón social</td>
                            <td th:text="${p.telefono}">000000000</td>
                            <td>
                                <span class="badge bg-success" th:if="${p.estado == 1}">Activo</span>
                                <span class="badge bg-secondary" th:if="${p.estado != 1}">Inactivo</span>
                            </td>
                            <td>
                                <a th:href="@{/proveedores(type=infoEdit, id=${p.id_proveedor})}"
                                   class="btn btn-sm btn-warning"><i class="bi bi-pencil"></i></a>
                                <form th:action="@{/proveedores}" method="post" class="d-inline"
                                      onsubmit="return confirm('¿Eliminar este proveedor?');">
                                    <input type="hidden" name="type" value="eliminar"/>
                                    <input type="hidden" name="id" th:value="${p.id_proveedor}"/>
                                    <button type="submit" class="btn btn-sm btn-danger"><i class="bi bi-trash"></i></button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(dataProveedor)}">
                            <td colspan="6" class="text-center text-muted">No hay proveedores registrados.</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- AGREGAR -->
            <div class="tab-pane fade" id="agregar" th:classappend="${activeTab == 'agregar'} ? 'show active'">
                <h5 class="mb-3">Nuevo Proveedor</h5>
                <form th:action="@{/proveedores}" method="post" class="row g-3">
                    <input type="hidden" name="type" value="registrar"/>
                    <div class="col-md-6">
                        <label class="form-label">RUC</label>
                        <input type="text" name="txtRuc" class="form-control" maxlength="11" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Razón Social</label>
                        <input type="text" name="txtRazonSocial" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Teléfono</label>
                        <input type="text" name="txtTelefono" class="form-control" maxlength="15" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Estado</label>
                        <select name="txtEstado" class="form-select">
                            <option value="1" selected>Activo</option>
                            <option value="0">Inactivo</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-success"><i class="bi bi-save"></i> Registrar</button>
                        <button type="reset" class="btn btn-secondary">Limpiar</button>
                    </div>
                </form>
            </div>

            <!-- CONSULTAR -->
            <div class="tab-pane fade" id="consultar">
                <h5 class="mb-3">Consultar Proveedor</h5>
                <form th:action="@{/proveedores}" method="get" class="d-flex gap-2 mb-3">
                    <input type="hidden" name="type" value="buscar"/>
                    <input type="text" name="txtBuscar" class="form-control"
                           placeholder="Buscar proveedor por razón social...">
                    <button type="submit" class="btn btn-primary">Buscar</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- MODAL EDITAR -->
<th:block th:if="${proveedorDataEdit != null}">
    <div class="modal fade" id="modalEditarProveedor" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form th:action="@{/proveedores}" method="post">
                    <div class="modal-header">
                        <h5 class="modal-title"><i class="bi bi-pencil"></i> Editar Proveedor</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" name="type" value="editar"/>
                        <input type="hidden" name="idProveedor" th:value="${proveedorDataEdit.id_proveedor}"/>
                        <div class="mb-3">
                            <label class="form-label">RUC</label>
                            <input type="text" name="txtRuc" class="form-control"
                                   th:value="${proveedorDataEdit.ruc}" maxlength="11" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Razón Social</label>
                            <input type="text" name="txtRazonSocial" class="form-control"
                                   th:value="${proveedorDataEdit.razon_social}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Teléfono</label>
                            <input type="text" name="txtTelefono" class="form-control"
                                   th:value="${proveedorDataEdit.telefono}" maxlength="15" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Estado</label>
                            <select name="txtEstado" class="form-select">
                                <option value="1" th:selected="${proveedorDataEdit.estado == 1}">Activo</option>
                                <option value="0" th:selected="${proveedorDataEdit.estado == 0}">Inactivo</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <a th:href="@{/proveedores(type=listar)}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Guardar cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var modal = new bootstrap.Modal(document.getElementById('modalEditarProveedor'));
            modal.show();
        });
    </script>
</th:block>

<script th:replace="~{fragments/comunes :: scripts}"></script>
</body>
</html>
