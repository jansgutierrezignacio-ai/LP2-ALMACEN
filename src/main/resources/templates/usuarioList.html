<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/comunes :: head('Usuarios')}"></head>
<body>
<div class="d-flex">
    <nav th:replace="~{fragments/comunes :: menu}"></nav>
    <div class="content flex-grow-1 p-3">
        <div th:replace="~{fragments/comunes :: topbar('Usuarios', 'bi-person-badge')}"></div>

        <div class="alert alert-success alert-dismissible fade show" role="alert"
             th:if="${!#strings.isEmpty(mensajeOk)}">
            <i class="bi bi-check-circle"></i> <span th:text="${mensajeOk}">OK</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card-content">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5>Listado de Usuarios (<span th:text="${cantReg != null ? cantReg : 0}">0</span>)</h5>
            </div>
            <div class="table-responsive">
                <table class="table table-custom table-hover">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Username</th>
                            <th>Tipo</th>
                            <th>Nombres</th>
                            <th>Apellidos</th>
                            <th class="text-end">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${data}">
                            <td th:text="${u.idUsuario}">1</td>
                            <td th:text="${u.username}">usuario</td>
                            <td th:text="${u.nombreTipo != null ? u.nombreTipo : u.idTipo}">Administrador</td>
                            <td th:text="${u.nombres}">Nombres</td>
                            <td th:text="${u.apellidos}">Apellidos</td>
                            <td class="text-end">
                                <a th:href="@{/usuarios(type=infoEdit, id=${u.idUsuario})}"
                                   class="btn btn-sm btn-outline-primary">
                                    <i class="bi bi-pencil-square"></i> Editar
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(data)}">
                            <td colspan="6" class="text-center text-muted">No hay usuarios registrados.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="text-end">
                <a th:href="@{/usuarios/nuevo}" class="btn btn-primary">Registrar nuevo usuario</a>
            </div>
        </div>
    </div>
</div>

<!-- MODAL EDITAR (se abre automáticamente si hay usuarioDataEdit) -->
<th:block th:if="${usuarioDataEdit != null}">
    <div class="modal fade" id="modalEditarUsuario" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form th:action="@{/usuarios}" method="post">
                    <div class="modal-header">
                        <h5 class="modal-title"><i class="bi bi-pencil"></i> Editar Usuario</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" name="type" value="editar"/>
                        <input type="hidden" name="idUsuario" th:value="${usuarioDataEdit.idUsuario}"/>
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" name="txtUsername" class="form-control"
                                   th:value="${usuarioDataEdit.username}" minlength="6" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Clave</label>
                            <input type="password" name="txtClave" class="form-control"
                                   placeholder="Dejar en blanco para conservar la actual" minlength="6">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Tipo</label>
                            <select class="form-select" name="cboTipo">
                                <option value="1" th:selected="${usuarioDataEdit.idTipo == 1}">Administrador</option>
                                <option value="2" th:selected="${usuarioDataEdit.idTipo == 2}">Vendedor</option>
                                <option value="3" th:selected="${usuarioDataEdit.idTipo == 3}">Almacenero</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Nombres</label>
                            <input type="text" name="txtNombres" class="form-control"
                                   th:value="${usuarioDataEdit.nombres}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Apellidos</label>
                            <input type="text" name="txtApellidos" class="form-control"
                                   th:value="${usuarioDataEdit.apellidos}" required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <a th:href="@{/usuarios}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Guardar cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var modal = new bootstrap.Modal(document.getElementById('modalEditarUsuario'));
            modal.show();
        });
    </script>
</th:block>

<script th:replace="~{fragments/comunes :: scripts}"></script>
</body>
</html>
